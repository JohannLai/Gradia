name: FitnessApp
options:
  bundleIdPrefix: com.lizhihang
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 14
    MARKETING_VERSION: 1.0
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_STRICT_CONCURRENCY: targeted
packages:
  MuscleMap:
    url: https://github.com/melihcolpan/MuscleMap.git
    from: 1.6.4
targets:
  FitnessApp:
    type: application
    platform: iOS
    sources:
      - path: FitnessApp
        excludes:
          - "Resources/**"
    resources:
      - path: FitnessApp/Resources
    dependencies:
      - package: MuscleMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lizhihang.fitnesslog
        PRODUCT_NAME: Gradia
        PRODUCT_MODULE_NAME: FitnessApp
        INFOPLIST_KEY_CFBundleDisplayName: Gradia
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_NSCameraUsageDescription: 用于拍摄餐食和体型照片，照片仅保存到你的私有健身记录。
        INFOPLIST_KEY_NSHealthShareUsageDescription: 读取体重、步数、睡眠、训练和心率，用于生成个人训练与恢复统计。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 将你在 App 内完成的力量训练保存到 Apple 健康。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CODE_SIGN_ENTITLEMENTS: FitnessApp/FitnessApp.entitlements
    entitlements:
      path: FitnessApp/FitnessApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    scheme:
      testTargets:
        - FitnessAppTests
      gatherCoverageData: true
  FitnessAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FitnessAppTests
    dependencies:
      - target: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lizhihang.fitnesslog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Gradia.app/Gradia"
        BUNDLE_LOADER: "$(TEST_HOST)"
